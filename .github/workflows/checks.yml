name: Aegis checks
on:
  push:
  pull_request:
jobs:
  unit-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f compose.windows.yml --profile windows-lab config --quiet
        env:
          WINDOWS_PASSWORD: ci-config-check-only
      - run: docker compose build ai-gateway
  elastic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: docker pull docker.elastic.co/elasticsearch/elasticsearch:8.12.0
      - run: python tests/smoke_elasticsearch.py
